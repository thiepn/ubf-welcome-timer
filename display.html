<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>UBF Köln — Gottesdienst</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%230f5eab'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Arial' fill='white' text-anchor='middle'%3EU%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/display.css">
</head>
<body class="loading">
  <main class="stage" id="stage" aria-label="Gottesdienst-Projektion">
    <img class="slide-image slide-image--welcome" src="./assets/welcome.png" alt="" aria-hidden="true">
    <img class="slide-image slide-image--clean" src="./assets/background-clean.png" alt="" aria-hidden="true">
    <div class="countdown" id="countdown" aria-hidden="true">
      <svg class="progress-ring" viewBox="0 0 660 660" aria-hidden="true">
        <circle class="progress-track" cx="330" cy="330" r="294" />
        <circle class="progress-fill" id="progress-ring" cx="330" cy="330" r="294" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 330 330)" />
      </svg>
      <div class="timer-numbers" id="timer-numbers" role="timer" aria-label="Verbleibende Zeit">05:00</div>
    </div>
    <span class="sr-only" id="accessible-status" aria-live="polite">Willkommen zum Gottesdienst.</span>
  </main>
  <script type="module" src="./js/display.js"></script>
</body>
</html>
