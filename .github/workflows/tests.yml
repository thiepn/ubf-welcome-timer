name: Tests (no deployment)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-pages:
    name: Unit tests and GitHub Pages path checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js server.mjs tests/*.test.js; do node --check "$file"; done
      - name: Unit, synchronization, and Pages checks
        run: npm test

  browser:
    name: Chromium browser acceptance (automated only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependency
        run: python -m pip install --requirement requirements-test.txt
      - name: Install Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser
