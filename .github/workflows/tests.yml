name: Tests (no deployment)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-pages:
    name: Unit tests and GitHub Pages path checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js server.mjs tests/*.test.js; do node --check "$file"; done
      - name: Unit, synchronization, and Pages checks
        run: npm test

  browser:
    name: Chromium browser acceptance (automated only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test dependency
        run: python -m pip install --requirement requirements-test.txt
      - name: Install Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests and capture transient UI screenshots
        env:
          UBF_CAPTURE_UI: '1'
        run: npm run test:browser
      - name: Attach short-lived browser screenshots for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubf-controller-ui-qa
          path: artifacts/ui-qa/*.png
          retention-days: 1
          if-no-files-found: warn

  windows-launch:
    name: Windows launcher HTTP smoke (Windows Server 2022 runner)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the double-click CMD launcher and local assets
        run: node --test tests/windows-launch.test.js tests/browser-open.test.js

  windows-old-node:
    name: Windows unsupported Node.js 18 rejection
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up unsupported Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Verify launcher refuses unsupported Node.js
        run: node --test tests/windows-node18.test.js

  native-windows:
    name: Native Tauri compile and Rust policy tests (no packaging)
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Check staged desktop frontend
        run: node --test tests/native-desktop.test.js
      - name: Compile and run native unit tests (no installer)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Run real WebView2 dual-window timer propagation (no physical projector)
        run: node tests/native-webview2-smoke.mjs
      # Draft PR #4 only. Windows CI makes and then discards a local ZIP;
      # never upload runnable binaries or publish a release.
      - name: Checkout exact PR HEAD for local rehearsal build
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 4
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build local unsigned rehearsal ZIP (NO UPLOAD)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 4
        shell: powershell
        run: .\scripts\Build-Windows-Rehearsal.ps1
